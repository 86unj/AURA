name: Supabase keep-alive

on:
  schedule:
    # Daily at 15:00 UTC. Free-tier projects pause after 7 days with no database activity.
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query aura_reports
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Add SUPABASE_URL and SUPABASE_ANON_KEY as repository secrets."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --get "${SUPABASE_URL%/}/rest/v1/aura_reports" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json"
