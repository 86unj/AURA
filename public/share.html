<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Aura card</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070c;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #e9d5ff;
        --border: rgba(255, 255, 255, 0.1);
        --surface: rgba(255, 255, 255, 0.05);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at 50% 0%, #1a1030 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
      }

      body {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
      }

      .shell {
        width: min(100%, 420px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
      }

      .brand {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.28em;
        color: var(--muted);
        text-transform: uppercase;
      }

      .card-frame {
        width: 100%;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
        background: var(--surface);
        border: 1px solid var(--border);
      }

      .card-frame img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }

      .status {
        text-align: center;
        max-width: 28rem;
      }

      .status h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        font-weight: 400;
        letter-spacing: 0.02em;
      }

      .status p {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 0.95rem;
        line-height: 1.45;
        color: var(--muted);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        width: 100%;
      }

      .btn {
        appearance: none;
        border: none;
        border-radius: 16px;
        height: 54px;
        padding: 0 22px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.03em;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--accent);
        color: var(--bg);
        flex: 1 1 160px;
      }

      .btn-primary[aria-disabled="true"] {
        opacity: 0.45;
        pointer-events: none;
      }

      .note {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }

      .hidden {
        display: none !important;
      }

      .spinner {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.15);
        border-top-color: var(--accent);
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script src="./share-config.js"></script>
  </head>
  <body>
    <div class="shell">
      <div class="brand">Aura</div>

      <div id="loading" class="status">
        <div class="spinner" aria-hidden="true" style="margin: 0 auto 16px"></div>
        <p>Opening shared card…</p>
      </div>

      <div id="expired" class="status hidden">
        <h1>Link expired</h1>
        <p>This aura card share is gone. Ask the owner for a new link.</p>
      </div>

      <div id="live" class="hidden" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 20px">
        <div class="card-frame">
          <img id="cardImage" alt="Shared aura card" />
        </div>
        <div class="actions">
          <a id="downloadBtn" class="btn btn-primary" href="#" download="aura-card.png">Download</a>
        </div>
        <p class="note">Link expires 24 hours after it was created.</p>
      </div>
    </div>

    <script>
      (function () {
        const loading = document.getElementById("loading");
        const expired = document.getElementById("expired");
        const live = document.getElementById("live");
        const cardImage = document.getElementById("cardImage");
        const downloadBtn = document.getElementById("downloadBtn");

        function showExpired() {
          loading.classList.add("hidden");
          live.classList.add("hidden");
          expired.classList.remove("hidden");
        }

        function showLive(imageUrl) {
          cardImage.src = imageUrl;
          downloadBtn.href = imageUrl;
          loading.classList.add("hidden");
          expired.classList.add("hidden");
          live.classList.remove("hidden");
          // flex helper was overridden by .hidden; restore layout
          live.style.display = "flex";
        }

        const params = new URLSearchParams(window.location.search);
        const id = (params.get("id") || "").trim();
        const config = window.AURA_SHARE_CONFIG;

        if (!id || !config?.supabaseUrl || !config?.supabaseAnonKey) {
          showExpired();
          return;
        }

        const base = config.supabaseUrl.replace(/\/$/, "");
        const headers = {
          apikey: config.supabaseAnonKey,
          Authorization: "Bearer " + config.supabaseAnonKey,
          Accept: "application/json",
        };

        const url =
          base +
          "/rest/v1/aura_shares?id=eq." +
          encodeURIComponent(id) +
          "&select=image_path,expires_at,revoked_at";

        fetch(url, { headers })
          .then(function (res) {
            if (!res.ok) throw new Error("fetch failed");
            return res.json();
          })
          .then(function (rows) {
            const row = Array.isArray(rows) ? rows[0] : null;
            if (!row || !row.image_path) {
              showExpired();
              return;
            }
            if (row.revoked_at) {
              showExpired();
              return;
            }
            if (row.expires_at && Date.parse(row.expires_at) <= Date.now()) {
              showExpired();
              return;
            }

            const bucket = config.sharesBucket || "aura-shares";
            const imageUrl =
              base + "/storage/v1/object/public/" + bucket + "/" + row.image_path;
            showLive(imageUrl);
          })
          .catch(function () {
            showExpired();
          });
      })();
    </script>
  </body>
</html>
