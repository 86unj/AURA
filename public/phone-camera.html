<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Aura phone camera</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        color: #f8fafc;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        touch-action: manipulation;
      }
      #preview,
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      #preview {
        /* Camera element is only a frame source; the canvas is what we show. */
        opacity: 0;
        pointer-events: none;
      }
      #status {
        position: fixed;
        left: 12px;
        right: 12px;
        top: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(15, 17, 26, 0.7);
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
        pointer-events: none;
      }
      #start {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        padding: 14px 26px;
        border: 0;
        border-radius: 16px;
        background: #e9d5ff;
        color: #05070c;
        font-size: 16px;
        font-weight: 800;
      }
      #controls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 18px 24px calc(18px + env(safe-area-inset-bottom, 0px));
        display: none;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(to top, rgba(5, 7, 12, 0.72), transparent);
      }
      #controls.visible {
        display: flex;
      }
      #controls.analyzing {
        pointer-events: none;
        opacity: 0.75;
      }
      #flip {
        width: 48px;
        height: 48px;
        border-radius: 24px;
        border: 1px solid rgba(248, 250, 252, 0.28);
        background: rgba(15, 17, 26, 0.55);
        color: #f8fafc;
        display: grid;
        place-items: center;
        padding: 0;
      }
      #flip svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #shutter {
        width: 74px;
        height: 74px;
        border-radius: 37px;
        border: 4px solid #f8fafc;
        background: transparent;
        padding: 0;
        display: grid;
        place-items: center;
      }
      #shutter::after {
        content: "";
        width: 58px;
        height: 58px;
        border-radius: 29px;
        background: #f8fafc;
      }
      #shutter:active::after {
        transform: scale(0.92);
      }
      #shutter:disabled {
        opacity: 0.45;
      }
      #spacer {
        width: 48px;
        height: 48px;
      }
      #review {
        display: none;
        width: 100%;
        max-width: 420px;
        gap: 12px;
      }
      #review.visible {
        display: flex;
      }
      #liveDock {
        display: none;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }
      #liveDock.visible {
        display: flex;
      }
      .btn {
        height: 52px;
        border-radius: 16px;
        border: 0;
        font-size: 15px;
        font-weight: 800;
        padding: 0 22px;
      }
      #retake {
        background: rgba(15, 17, 26, 0.7);
        color: #f8fafc;
        border: 1px solid rgba(248, 250, 252, 0.22);
      }
      #analyze {
        flex: 1;
        background: #e9d5ff;
        color: #05070c;
      }
      #analyze:disabled,
      #retake:disabled {
        opacity: 0.55;
      }
      #analyzingBadge {
        display: none;
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        padding: 12px 18px;
        border-radius: 999px;
        background: rgba(15, 17, 26, 0.75);
        font-size: 14px;
        font-weight: 800;
      }
      #analyzingBadge.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="stage" aria-hidden="true"></canvas>
    <button id="start" type="button">Start camera</button>
    <div id="status" role="status" aria-live="polite">Starting…</div>
    <div id="analyzingBadge">Reading aura…</div>
    <div id="controls" aria-label="Camera controls">
      <div id="liveDock" class="visible">
        <button id="flip" type="button" aria-label="Flip camera">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 9v2a8 8 0 0 1-14.3 4.9" />
            <path d="M4 15v-2a8 8 0 0 1 14.3-4.9" />
            <path d="M20 5v4h-4" />
            <path d="M4 19v-4h4" />
          </svg>
        </button>
        <button id="shutter" type="button" aria-label="Capture" disabled></button>
        <div id="spacer" aria-hidden="true"></div>
      </div>
      <div id="review">
        <button id="retake" class="btn" type="button">Retake</button>
        <button id="analyze" class="btn" type="button">Analyze aura</button>
      </div>
    </div>

    <script>
      /*
       * Phone side of the phone → laptop link. Runs inside the app's WebView.
       * This page has no network access to Supabase itself: signaling
       * messages are relayed by the React Native app via postMessage
       * (page → app) and window.auraOnSignal (app → page).
       * See src/services/remoteSignaling.ts for the protocol.
       *
       * Orientation: mobile browsers often tag rotation in the
       * urn:3gpp:video-orientation RTP extension instead of rotating pixels.
       * Aura Lab uploads frames with WebGL texImage2D, which frequently
       * ignores that metadata — so the laptop looks sideways. We (1) strip
       * the extension from the offer and (2) re-draw upright into a canvas
       * and send canvas.captureStream() so the bitstream itself is upright.
       *
       * Capture UI lives here; Aura Lab still freezes/analyzes the frame.
       */
      const config = window.AURA_CONFIG || {
        iceServers: [{ urls: "stun:stun.l.google.com:19302" }],
      };
      const MAX_BITRATE = 2500000;

      const video = document.getElementById("preview");
      const stage = document.getElementById("stage");
      const stageCtx = stage.getContext("2d", { alpha: false });
      const statusEl = document.getElementById("status");
      const startButton = document.getElementById("start");
      const controlsEl = document.getElementById("controls");
      const liveDock = document.getElementById("liveDock");
      const reviewDock = document.getElementById("review");
      const shutterButton = document.getElementById("shutter");
      const flipButton = document.getElementById("flip");
      const retakeButton = document.getElementById("retake");
      const analyzeButton = document.getElementById("analyze");
      const analyzingBadge = document.getElementById("analyzingBadge");

      let cameraStream = null;
      let stream = null;
      let pc = null;
      let offerId = null;
      let laptopSession = null;
      let pendingIce = [];
      let retryTimer = null;
      let paintId = 0;
      let facingMode = "environment";
      let flipping = false;
      let phase = "live"; // live | frozen | analyzing
      let linkConnected = false;

      /** Drop video-orientation so the encoder rotates pixels instead of tagging. */
      function withoutVideoOrientation(sdp) {
        if (!sdp) return sdp;
        return sdp.replace(/^a=extmap:[^\r\n]*urn:3gpp:video-orientation[^\r\n]*\r?\n/gm, "");
      }

      function devicePortrait() {
        return window.innerHeight >= window.innerWidth;
      }

      /**
       * 90° clockwise turns needed so a landscape sensor frame looks upright
       * on the current device orientation (rear camera).
       */
      function uprightTurns(frameW, frameH) {
        const frameLandscape = frameW >= frameH;
        const screenLandscape = !devicePortrait();
        if (frameLandscape === screenLandscape) return 0;
        const angle =
          (screen.orientation && typeof screen.orientation.angle === "number"
            ? screen.orientation.angle
            : typeof window.orientation === "number"
              ? window.orientation
              : 0) || 0;
        // Portrait: usually 90° CW; upside-down portrait: 90° CCW.
        if (!screenLandscape) return angle === 180 ? 3 : 1;
        // Landscape with a portrait-coded frame.
        return angle === 270 || angle === -90 ? 3 : 1;
      }

      function paintFrame() {
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        if (!vw || !vh || !stageCtx) {
          paintId = requestAnimationFrame(paintFrame);
          return;
        }
        // Keep painting while frozen so the laptop still has a live feed if
        // the user retakes; Aura Lab freezes its own canvas on capture.
        const turns = uprightTurns(vw, vh) % 4;
        const outW = turns % 2 === 1 ? vh : vw;
        const outH = turns % 2 === 1 ? vw : vh;
        if (stage.width !== outW || stage.height !== outH) {
          stage.width = outW;
          stage.height = outH;
        }
        stageCtx.save();
        if (turns === 1) {
          stageCtx.translate(outW, 0);
          stageCtx.rotate(Math.PI / 2);
        } else if (turns === 2) {
          stageCtx.translate(outW, outH);
          stageCtx.rotate(Math.PI);
        } else if (turns === 3) {
          stageCtx.translate(0, outH);
          stageCtx.rotate(-Math.PI / 2);
        }
        stageCtx.drawImage(video, 0, 0, vw, vh);
        stageCtx.restore();
        paintId = requestAnimationFrame(paintFrame);
      }

      function post(type, payload) {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type, ...payload }));
        }
      }

      function report(type, message) {
        statusEl.textContent = message;
        post(type, { message });
      }

      function setLinkState(state, message) {
        statusEl.textContent = message;
        linkConnected = state === "connected";
        updateControls();
        post("status", { state, message });
      }

      function sendSignal(kind, data) {
        post("signal", { kind, data });
      }

      function setPhase(next) {
        phase = next;
        updateControls();
      }

      function updateControls() {
        const ready = Boolean(stream);
        controlsEl.classList.toggle("visible", ready);
        controlsEl.classList.toggle("analyzing", phase === "analyzing");
        const showLive = phase === "live";
        liveDock.classList.toggle("visible", showLive);
        reviewDock.classList.toggle("visible", !showLive);
        analyzingBadge.classList.toggle("visible", phase === "analyzing");
        // Hide the status chip once live so it doesn't cover the shutter.
        statusEl.style.display =
          ready && linkConnected && phase === "live" ? "none" : "block";
        shutterButton.disabled = !linkConnected || phase !== "live" || flipping;
        flipButton.disabled = phase !== "live" || flipping;
        retakeButton.disabled = phase === "analyzing";
        analyzeButton.disabled = phase !== "frozen";
        analyzeButton.textContent = phase === "analyzing" ? "Reading…" : "Analyze aura";
      }

      function closePeer() {
        if (pc) {
          pc.onicecandidate = null;
          pc.onconnectionstatechange = null;
          pc.close();
        }
        pc = null;
        offerId = null;
        pendingIce = [];
        linkConnected = false;
        updateControls();
      }

      function scheduleRetry() {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(() => sendSignal("phone-hello"), 3000);
      }

      async function tuneSender(peer) {
        // Favor smooth motion over sharpness: the aura effect needs frame rate.
        for (const sender of peer.getSenders()) {
          if (!sender.track || sender.track.kind !== "video") continue;
          try {
            const params = sender.getParameters();
            if (!params.encodings || !params.encodings.length) params.encodings = [{}];
            params.encodings[0].maxBitrate = MAX_BITRATE;
            params.degradationPreference = "maintain-framerate";
            await sender.setParameters(params);
          } catch (error) {
            console.warn("setParameters failed", error);
          }
        }
      }

      async function openCamera(facing) {
        const baseVideo = {
          width: { ideal: 720 },
          height: { ideal: 1280 },
          frameRate: { ideal: 30 },
        };
        let next;
        try {
          next = await navigator.mediaDevices.getUserMedia({
            video: { ...baseVideo, facingMode: { exact: facing } },
            audio: false,
          });
        } catch {
          next = await navigator.mediaDevices.getUserMedia({
            video: { ...baseVideo, facingMode: { ideal: facing } },
            audio: false,
          });
        }
        const camTrack = next.getVideoTracks()[0];
        if ("contentHint" in camTrack) camTrack.contentHint = "motion";
        if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = next;
        facingMode = facing;
        video.srcObject = cameraStream;
        await video.play().catch(() => {});
        if (!video.videoWidth) {
          await new Promise((resolve) => {
            video.addEventListener("loadeddata", resolve, { once: true });
          });
        }
      }

      async function flipCamera() {
        if (flipping || phase !== "live" || !cameraStream) return;
        flipping = true;
        updateControls();
        const nextFacing = facingMode === "environment" ? "user" : "environment";
        try {
          await openCamera(nextFacing);
          setLinkState(
            linkConnected ? "connected" : "waiting",
            linkConnected
              ? "Live · streaming to laptop"
              : "Waiting for laptop… open Aura lab on your laptop.",
          );
        } catch (error) {
          report("error", `Flip failed: ${error.name}: ${error.message}`);
        } finally {
          flipping = false;
          updateControls();
        }
      }

      async function makeOffer() {
        closePeer();
        const id = Math.random().toString(36).slice(2);
        offerId = id;
        const peer = new RTCPeerConnection({ iceServers: config.iceServers });
        pc = peer;

        stream.getTracks().forEach((track) => peer.addTrack(track, stream));
        peer.onicecandidate = (event) => {
          if (event.candidate) {
            sendSignal("ice", { offerId: id, candidate: event.candidate.toJSON() });
          }
        };
        peer.onconnectionstatechange = () => {
          if (pc !== peer) return;
          const state = peer.connectionState;
          if (state === "connected") {
            clearTimeout(retryTimer);
            setLinkState("connected", "Live · streaming to laptop");
          } else if (state === "connecting") {
            setLinkState("connecting", "Connecting to laptop…");
          } else if (state === "failed") {
            setLinkState("failed", "Connection failed. Retrying…");
            scheduleRetry();
          } else if (state === "disconnected") {
            setLinkState("connecting", "Connection unstable…");
          }
        };

        setLinkState("connecting", "Connecting to laptop…");
        const offer = await peer.createOffer();
        const sdp = withoutVideoOrientation(offer.sdp);
        await peer.setLocalDescription({ type: "offer", sdp });
        sendSignal("offer", { offerId: id, sdp });
        await tuneSender(peer);
      }

      async function handleSignal(message) {
        if (!stream || !message) return;
        const data = message.data || {};
        switch (message.kind) {
          case "laptop-ready": {
            const alive =
              pc && ["new", "connecting", "connected"].includes(pc.connectionState);
            // Same laptop and the link is fine: nothing to do.
            if (alive && data.sessionId === laptopSession) return;
            laptopSession = data.sessionId;
            await makeOffer();
            break;
          }
          case "answer": {
            if (!pc || data.offerId !== offerId) return;
            await pc.setRemoteDescription({ type: "answer", sdp: data.sdp });
            const early = pendingIce;
            pendingIce = [];
            for (const candidate of early) {
              await pc.addIceCandidate(candidate).catch(() => {});
            }
            break;
          }
          case "ice": {
            if (!pc || data.offerId !== offerId || !data.candidate) return;
            if (pc.remoteDescription) {
              await pc.addIceCandidate(data.candidate).catch(() => {});
            } else {
              pendingIce.push(data.candidate);
            }
            break;
          }
          case "phase": {
            if (data.phase === "live" || data.phase === "frozen" || data.phase === "analyzing") {
              setPhase(data.phase);
            }
            break;
          }
          case "bye": {
            closePeer();
            laptopSession = null;
            setPhase("live");
            setLinkState("waiting", "Waiting for laptop… open Aura lab on your laptop.");
            break;
          }
        }
      }

      // Called by the React Native app with messages from the laptop.
      window.auraOnSignal = (message) => {
        handleSignal(message).catch((error) =>
          report("error", `Signaling error: ${error.message || error}`),
        );
      };

      async function startCamera() {
        startButton.style.display = "none";
        if (!window.isSecureContext) {
          report("error", "Not a secure context. The page must be served over HTTPS.");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          report("error", "getUserMedia is not available in this WebView.");
          return;
        }
        if (typeof RTCPeerConnection !== "function") {
          report("error", "WebRTC is not available in this WebView.");
          return;
        }
        try {
          await openCamera(facingMode);

          cancelAnimationFrame(paintId);
          paintFrame();

          // Bake orientation into pixels so the laptop WebGL path stays upright.
          if (typeof stage.captureStream === "function") {
            stream = stage.captureStream(30);
            const outTrack = stream.getVideoTracks()[0];
            if (outTrack && "contentHint" in outTrack) outTrack.contentHint = "motion";
          } else {
            stream = cameraStream;
          }

          setLinkState("waiting", "Waiting for laptop… open Aura lab on your laptop.");
          updateControls();
          post("page-ready", {});
        } catch (error) {
          report("error", `Camera failed: ${error.name}: ${error.message}`);
          // Some WebViews need a user gesture before opening the camera.
          startButton.style.display = "block";
        }
      }

      shutterButton.addEventListener("click", () => {
        if (shutterButton.disabled) return;
        setPhase("frozen");
        sendSignal("control", { action: "capture" });
      });
      retakeButton.addEventListener("click", () => {
        if (retakeButton.disabled) return;
        setPhase("live");
        sendSignal("control", { action: "retake" });
      });
      analyzeButton.addEventListener("click", () => {
        if (analyzeButton.disabled) return;
        setPhase("analyzing");
        sendSignal("control", { action: "analyze" });
      });
      flipButton.addEventListener("click", () => {
        flipCamera().catch(() => {});
      });
      startButton.addEventListener("click", startCamera);
      startCamera();
    </script>
  </body>
</html>
