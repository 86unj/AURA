<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Aura phone camera</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        color: #f8fafc;
        font-family: -apple-system, system-ui, sans-serif;
        overflow: hidden;
      }
      video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
      }
      #status {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 16px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(15, 17, 26, 0.7);
        font-size: 13px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
      #start {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: none;
        padding: 14px 26px;
        border: 0;
        border-radius: 16px;
        background: #e9d5ff;
        color: #05070c;
        font-size: 16px;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <video id="preview" playsinline autoplay muted></video>
    <button id="start" type="button">Start camera</button>
    <div id="status" role="status" aria-live="polite">Starting…</div>

    <script>
      // Spike: prove getUserMedia works inside the Expo Go WebView.
      // WebRTC + signaling will be added on top of this page next.
      const video = document.getElementById("preview");
      const statusEl = document.getElementById("status");
      const startButton = document.getElementById("start");

      function report(type, message) {
        statusEl.textContent = message;
        // Forward to React Native when running inside the app's WebView.
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type, message }));
        }
      }

      async function startCamera() {
        startButton.style.display = "none";
        if (!window.isSecureContext) {
          report("error", "Not a secure context. The page must be served over HTTPS.");
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          report("error", "getUserMedia is not available in this WebView.");
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 },
              frameRate: { ideal: 30 },
            },
            audio: false,
          });
          video.srcObject = stream;
          await video.play().catch(() => {});
          const settings = stream.getVideoTracks()[0].getSettings();
          report(
            "camera-ok",
            `Camera OK · ${settings.width}x${settings.height} @ ${Math.round(settings.frameRate || 0)} fps\n` +
              `RTCPeerConnection: ${typeof RTCPeerConnection === "function" ? "yes" : "no"}`,
          );
        } catch (error) {
          report("error", `Camera failed: ${error.name}: ${error.message}`);
          // Some WebViews need a user gesture before opening the camera.
          startButton.style.display = "block";
        }
      }

      startButton.addEventListener("click", startCamera);
      startCamera();
    </script>
  </body>
</html>
